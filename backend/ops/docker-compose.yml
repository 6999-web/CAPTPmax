services:
  backend-cpu:
    profiles: ["cpu"]
    build:
      context: ../..
      dockerfile: backend/Dockerfile.cpu
    container_name: captp-backend-cpu
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - CAPTP_RUNTIME_PROFILE=cpu
      - CAPTP_HOST=0.0.0.0
      - CAPTP_PORT=6063
    ports:
      - "6063:6063"
    volumes:
      - ../:/app/backend

  backend-gpu:
    profiles: ["gpu"]
    build:
      context: ../..
      dockerfile: backend/Dockerfile.gpu
    container_name: captp-backend-gpu
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - CAPTP_RUNTIME_PROFILE=gpu
      - CAPTP_HOST=0.0.0.0
      - CAPTP_PORT=6063
    ports:
      - "6063:6063"
    volumes:
      - ../:/app/backend
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://101.33.210.169:6063
    container_name: captp-frontend
    restart: unless-stopped
    ports:
      - "6062:80"
